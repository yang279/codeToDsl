<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>登录</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-card">
    <div class="login-title">欢迎回来</div>
    <div class="login-subtitle">请输入账号和密码登录</div>

    <div class="form-group">
      <label class="form-label">邮箱</label>
      <input class="form-input" type="email" placeholder="请输入邮箱" />
    </div>

    <div class="form-group">
      <label class="form-label">密码</label>
      <input class="form-input" type="password" placeholder="请输入密码" />
    </div>

    <button class="btn-submit">登录</button>

    <div class="login-footer">
      <span>还没有账号？</span>
      <a class="link-register" href="#">立即注册</a>
    </div>
  </div>
</body>
</html>
